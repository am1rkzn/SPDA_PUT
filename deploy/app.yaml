apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: put-data
  namespace: team-2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: put, namespace: team-2}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: put}}
  template:
    metadata: {labels: {app: put}}
    spec:
      nodeSelector:
        student-team: team-2
      tolerations:
        - key: student-team
          operator: Equal
          value: team-2
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: put-ghcr
      containers:
        - name: put
          image: ghcr.io/am1rkzn/spda-put@sha256:366cdd64720cbdeef986e8edd0f5af8367e943bf0b72d721c0640686c8f93511
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - secretRef:
                name: put-otel
          env:
            - {name: PUT_ENV, value: course}
            - {name: PUT_VERSION, value: "e1c7fe28403266b15da5f71098157b79435f2521"}
            - {name: PUT_OTEL_ENABLED, value: "true"}
          volumeMounts: [{name: db, mountPath: /data}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes: [{name: db, persistentVolumeClaim: {claimName: put-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: put, namespace: team-2}
spec:
  selector: {app: put}
  ports: [{port: 80, targetPort: http}]
