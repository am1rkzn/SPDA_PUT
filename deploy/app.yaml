apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: put-data
  namespace: team-2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: put, namespace: team-2}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: put}}
  template:
    metadata: {labels: {app: put}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      imagePullSecrets:
        - name: put-ghcr
      containers:
        - name: put
          image: ghcr.io/am1rkzn/spda-put@sha256:967f831d8d7e9a6b8d762240e3e88a3e3808cbbac3dae284347e2aadcf9c269f
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: PUT_ENV, value: course}
            - {name: PUT_VERSION, value: "33df9c0cc6a0d0fb4dfa06fcb698eb5d0539c10c"}
            - {name: PUT_OTEL_ENABLED, value: "false"}
          volumeMounts: [{name: db, mountPath: /data}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes: [{name: db, persistentVolumeClaim: {claimName: put-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: put, namespace: team-2}
spec:
  selector: {app: put}
  ports: [{port: 80, targetPort: http}]
