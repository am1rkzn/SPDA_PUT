apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: put-data, namespace: team-2}
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: ""  # впишите класс курса, либо оставьте комментарий для default
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: put, namespace: team-2}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: put}}
  template:
    metadata: {labels: {app: put}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      # imagePullSecrets: [{name: ""}]  # только для закрытого registry
      containers:
        - name: put
          image: ""  # полный адрес образа с тегом или digest
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{secretRef: {name: put-otel}}]
          env:
            - {name: PUT_ENV, value: course}
            - {name: PUT_VERSION, value: ""}  # версия сборки
            - {name: PUT_OTEL_ENABLED, value: "true"}
          volumeMounts: [{name: db, mountPath: /data}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes: [{name: db, persistentVolumeClaim: {claimName: put-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: put, namespace: team-2}
spec:
  selector: {app: put}
  ports: [{port: 80, targetPort: http}]
